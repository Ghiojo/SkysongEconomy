lore:
- |-
  <gray>A well-made resin coin with the symbol of
  <gray>House Hawke's bird in one side, and
  <gray>inscriptions in the other. This coin's resin
  <gray>is colored a light yellow, unlike the usual
  <gray>orange-amber color of pinches in order to
  <gray>differenciate them. Yet still, one can the in
  <gray>appreciate small aurean particles inside the
  <gray>coin, which are a much higher concentration
  <gray>than in lower denominations. Unlike what some
  <gray>may think, this is not an actual pouch, but
  <gray>rather a quaint name given to these kinds of
  <gray>coins.
- '&#424242This is worth <gold>1.0 AU<dark_gray>.'
