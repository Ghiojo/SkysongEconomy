name: SkysongEconomy
version: '${version}'
main: org.skysongdev.skysongEconomy.SkysongEconomy
api-version: '1.21'

depend:
  - Gringotts
  - Skysong_Items
  - SkysongStats

softdepend:
  - PlaceholderAPI

commands:
  se:
    description: Main command for SkysongEconomy
    usage: /<command>
    aliases: [skysongeconomy, seconomy, seco, skye]

permissions:
  skysongeconomy.good:
    description: Allows use of the economy features
    default: true
  skysongeconomy.ledger:
    description: Allows viewing the economy ledger
    default: op
  skysongeconomy.good.manage:
    description: Allows management of economy features
    default: op
  skysongeconomy.ledger.add:
    description: Allows adding entries to the economy ledger
    default: op
  skysongeconomy.ledger.remove:
    description: Allows removing entries from the economy ledger
    default: op
  skysongeconomy.business:
    description: Allows the /se business commands; owners can manage only their own businesses
    default: true
  skysongeconomy.business.admin:
    description: Allows every /se business command on every business (create, delete, tiers, owners)
    default: op
  skysongeconomy.business.break:
    description: Allows breaking business blocks; the business is kept until it is moved
    default: op
  skysongeconomy.tokens:
    description: Allows /se tokens balance, to see your own Gathering Tokens
    default: true
  skysongeconomy.tokens.admin:
    description: Allows seeing and changing anyone's Gathering Tokens
    default: op
  skysongeconomy.*:
    description: Gives access to all SkysongEconomy features
    default: op
    children:
      skysongeconomy.good: true
      skysongeconomy.ledger: true
      skysongeconomy.good.manage: true
      skysongeconomy.ledger.add: true
      skysongeconomy.ledger.remove: true
      skysongeconomy.business: true
      skysongeconomy.business.admin: true
      skysongeconomy.business.break: true
      skysongeconomy.tokens: true
      skysongeconomy.tokens.admin: true
