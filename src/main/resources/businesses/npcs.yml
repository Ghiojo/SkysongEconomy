# Business NPCs: NPCs a business owns. They need the SkysongNPCs plugin; without it this file
# is not used.
#
# A business has NPC slots for every skill listed under skills that it has picked. Each slot
# holds one NPC, made from that skill's SkysongNPCs template. The NPC belongs to the business's
# owner and follows the business when it changes hands. A skill can be listed here and in
# economy-and-logistics.yml at the same time: both apply.
#
# The owner creates the NPCs from the business menu, and so can any access group with the
# manage-npcs permission (see access.yml). Only staff can remove one, with
# /se business dismissnpc. When a business has more NPCs than slots (a lower tier, a cleared
# skill pick, a lower number here) its newest NPCs are removed.

# Where a new NPC appears:
#   player    a free spot in front of whoever creates it
#   business  a free spot next to the business block
spawn-at: player

# How many blocks around that place SkysongNPCs looks for a free spot.
spawn-radius: 3

# One entry per skill: a SkysongStats skill id, as in types.yml.
#   slots     how many NPCs the business can have for this skill. A number, a formula, or a
#             table. In a formula {level} is how many picks the business has of this skill and
#             {tier} is the business's tier. A table is written {by: level, 1: 1, 3: 2, 5: 3}
#             (or by: tier): the business gets the value of the highest step it has reached.
#   template  the SkysongNPCs template new NPCs are made from (a file in SkysongNPCs'
#             templates folder): entity, name, skin, base stats, ancestries.
#   progression  optional: what each NPC of the skill receives. Amounts are written like slots,
#             so they can grow with {level} or {tier}. Every id is checked when the server starts.
#       stat-points        points the owner assigns: amount, and optionally eligible (the stats
#                          they may go on; left out = the NPC's usual stats)
#       stats              stat bonuses that are simply there, such as {focus: 1}
#       proficiency-picks  picks the owner makes: skill, amount, max-tier and promote-cost. One
#                          block or a list of blocks. max-tier is the tier a pick gives
#                          (proficient when left out), or a table such as
#                          {by: level, 1: proficient, 4: adept}: picks then give the lowest tier,
#                          and from the step where a higher tier appears, promote-cost more picks
#                          on an already picked proficiency raise it one tier, up to that tier.
#                          Without promote-cost nothing is promoted.
#       proficiencies      fixed proficiencies, such as {perception: proficient}: raised to at
#                          least that tier
#       abilities          fixed abilities from SkysongNPCs' abilities.yml
#       ability-picks      abilities the owner chooses: amount and the from list
#       at                 more of the above from a level or tier on: {by: level, 3: {...}}.
#                          Every step reached counts, on top of the ones below it.
#   When the business grows, every NPC receives the difference. When it shrinks, what the
#   business gave the NPC is given back to assign again at the lower amounts.
#
# Example:
#   skills:
#     martial:
#       slots: "{level}"
#       template: business_guard
#       progression:
#         stat-points:
#           amount: "3 + {level}"
#         proficiency-picks:
#           - skill: martial
#             amount: "2 + {level}"
#             max-tier: {by: level, 1: proficient, 4: adept}
#             promote-cost: 1
#         at:
#           by: level
#           3: {abilities: [brawler]}
#           5: {ability-picks: {amount: 1, from: [sentinel, duelist, medic]}}
#     economical:
#       slots: {by: level, 1: 1, 3: 2, 5: 3}
#       template: business_clerk
#       progression:
#         stats: {focus: 1}
#         at:
#           by: level
#           1: {proficiencies: {perception: proficient, survival: proficient}}
#           4: {proficiencies: {perception: adept, survival: adept}}
skills: {}
