# Every player-facing text of SkysongEconomy, in MiniMessage (https://docs.advntr.dev/minimessage/format.html).
# Words in <angle_brackets> that aren't colours are placeholders filled in by the plugin.
# Keys you delete fall back to the defaults, so it's safe to keep only the ones you change.

prefix: "<dark_gray>[<gold>SkysongEconomy<dark_gray>] <reset>"

command:
  players-only: "<red>Only players can use this command."
  no-permission: "<red>You don't have permission to do that."
  usage: "<red>Usage: <usage>"
  look-at-block: "<red>Look at a block within 5 blocks first."
  unknown-player: "<red>No player named <yellow><player></yellow> has played here."
  no-active-character: "<red><player> isn't playing a character right now. Name one of their profiles."
  unknown-character: "<red><player> has no character called <yellow><profile></yellow>."
  you-have-no-character: "<red>You need to be playing a character to do that."

menu:
  previous-page: "<yellow>Previous page"
  next-page: "<yellow>Next page"
  back: "<yellow>Back"
  close: "<red>Close"
  confirm: "<green><bold>Confirm"
  cancel: "<red><bold>Cancel"

prompt:
  cancel-word: "cancel"
  cancelled: "<gray>Cancelled."
  timed-out: "<gray>You took too long to answer, so nothing changed."
  rename: "<yellow>Type the business's new name in chat, or <white>cancel</white> to keep the current one."

business:
  not-found: "<red>There is no business with the id <yellow><id></yellow>."
  invalid-id: "<red><yellow><id></yellow> isn't a valid id. Use lower case letters, digits, '_' and '-'."
  id-taken: "<red>A business with the id <yellow><id></yellow> already exists."
  unknown-type: "<red>There is no business type called <yellow><type></yellow>."
  block-taken: "<red>That block already belongs to <yellow><business></yellow>."
  invalid-name: "<red>A business name must be 1 to <max> characters."
  invalid-shift-message: "<red>A shift message must be 1 to <max> characters."
  invalid-tier: "<red>The tier must be a number from <min> to <max>."
  not-owner: "<red>Only the owner of <yellow><business></yellow> can do that."
  # Shown as <owner> for a server-owned business (a base NPC business run by staff).
  server-owner: "the server"
  hire:
    is-owner: "<red>The owner doesn't need to be hired."
    already-worker: "<red><character> already works here."
    full: "<red>This business is full: its tier allows <max> worker(s)."
  fire:
    not-worker: "<red><character> doesn't work here."
  created: "<green>Created the <type> business <yellow><business></yellow> for <owner>."
  deleted: "<green>Deleted the business <yellow><business></yellow>."
  delete-confirm: "<yellow>This deletes <business> for good. Run <white>/se business delete <id> confirm</white> to go ahead."
  moved: "<green><yellow><business></yellow> now opens from this block."
  renamed: "<green>The business is now called <yellow><business></yellow>."
  shift-message-set: "<green>Shift message set to: <gray><message>"
  shift-message-reset: "<green>The shift message is back to the server default."
  tier-set: "<green><yellow><business></yellow> is now tier <tier>."
  tier-removed-workers: "<yellow>The new tier has fewer worker slots, so these newest hires were removed: <workers>"
  tier-removed-picks: "<yellow>The new tier has fewer skill picks, so these newest picks were removed: <skills>"
  owner-set: "<green><yellow><business></yellow> now belongs to <owner>."
  hired: "<green><character> now works at <yellow><business></yellow>."
  fired: "<green><character> no longer works at <yellow><business></yellow>."
  info: |-
    <gold><business> <gray>(<id>)
    <gray>Type: <white><type></white>  Tier: <white><tier></white>
    <gray>Owner: <white><owner></white>
    <gray>Workers (<count>/<max>): <white><workers></white>
    <gray>Skill picks (<free_picks> free): <white><picks></white>
    <gray>Block: <white><position></white>
  info-no-workers: "none"
  info-no-block: "none, use /se business move"
  list-header: "<gold>Businesses (<count>):"
  list-entry: "<gray>- <white><business></white> <dark_gray>(<id>, <type>, tier <tier>)"
  access:
    no-such-group: "<red>This business has no group called <yellow><group></yellow>."
    invalid-group-id: "<red>A group name may use lower case letters, digits, '_' and '-', up to <max> characters."
    group-taken: "<red>This business already has a group called <yellow><group></yellow>."
    too-many-groups: "<red>A business can have at most <max> groups of its own."
    built-in-delete: "<red>The <yellow><group></yellow> group is built in and can't be deleted."
    built-in-members: "<red>Who is in <yellow><group></yellow> is decided for you: workers are its workers, everyone is everyone."
    already-member: "<red><character> is already in <yellow><group></yellow>."
    not-member: "<red><character> isn't in <yellow><group></yellow>."
    unknown-permission: "<red><yellow><permission></yellow> isn't a permission. Use one of: <permissions>."
    invalid-price: "<red><yellow><price></yellow> isn't a valid price. Use a number of 0 or more."
    group-created: "<green>Created the group <yellow><group></yellow> at <business>. It allows nothing yet: use <white>allow</white> to change that."
    group-deleted: "<green>Deleted the group <yellow><group></yellow> from <business>."
    allowed: "<green>Members of <yellow><group></yellow> may now <permission> at <business>."
    denied: "<green>Members of <yellow><group></yellow> may no longer <permission> at <business>."
    price-set: "<green>Training at <business> now costs members of <yellow><group></yellow> <white><price></white>."
    member-added: "<green><character> is now in <yellow><group></yellow> at <business>."
    member-removed: "<green><character> is no longer in <yellow><group></yellow> at <business>."
    list-header: "<gold>Access groups of <business>:"
    list-entry: "<gray>- <white><group></white>: <permissions>. Training costs <white><price></white>. <dark_gray>Members: <members>"
    members-workers: "its workers"
    members-everyone: "everyone"
    members-none: "nobody yet"
    permissions-none: "may do nothing"
  vault:
    empty: "<red>The vault is empty."
    server-owned: "<red><business> belongs to the server: its vault pays whoever collects it, so collect it in game."
    collect-failed: "<red>Couldn't pay out <amount>. Make room for the coins and try again; the vault keeps them."
    balance: "<gold>The vault of <business> holds <white><amount></white>."
    collected: "<green>Paid <white><amount></white> from the vault of <business> to <owner>."
    collected-own: "<green>You collected <white><amount></white> from the vault."
    button:
      name: "<gold>Vault"
      lore:
        - "<gray>Holds <white><amount></white>: your cut of"
        - "<gray>shift pay and paid training."
        - ""
        - "<yellow>Click to collect it."
      lore-empty:
        - "<gray>Empty. It fills with your cut"
        - "<gray>of shift pay and paid training."
  ledgers:
    not-enabled: "<red><business> has no Economy and Logistics. Pick an Economy and Logistics skill first."
    unknown: "<red>There is no ledger <yellow><ledger></yellow>."
    already-selected: "<red>This business has already selected <yellow><ledger></yellow>."
    full: "<red>All <max> ledger slot(s) are in use. Remove a ledger first."
    not-selected: "<red>This business hasn't selected <yellow><ledger></yellow>."
    cannot-afford-fine: "<red>Removing a ledger costs <white><fine></white>, and you don't have that much."
    selected: "<green>Selected <ledger><green> for <business>."
    removed: "<green>Removed <ledger><green> from <business> and paid the fine of <white><fine></white>."
    button:
      name: "<gold>Ledgers"
      lore:
        - "<gray>The trade ledgers this business"
        - "<gray>imports and exports through."
        - ""
        - "<white><used>/<max></white> <gray>ledger slots used"
        - ""
        - "<yellow>Click to browse them."
    menu:
      title: "Ledgers · <business>"
      header:
        name: "<gold>Ledger slots"
        lore:
          - "<white><used>/<max></white> <gray>used"
          - "<gray>Removing a ledger costs <white><fine></white>."
      selected: "<green>Selected by this business"
      not-selected: "<gray>Not selected"
      click: "<yellow>Click to see its imports and exports."
      tax-exempt: "<aqua>Tax exempt"
    details:
      title: "<ledger>"
      counts: "<white><imports></white> <gray>import(s), <white><exports></white> <gray>export(s)"
      import-tag: "<aqua>Import"
      export-tag: "<light_purple>Export"
      import-times: "<gray>Delivery: <times>"
      export-item: "<gray>Sells <white><batch></white> × <white><item></white> per click"
      export-good-type: "<gray>Sells <white><batch></white> item(s) of type <white><type></white> per click"
      select:
        name: "<green>Select this ledger"
        lore:
          - "<gray>Puts it in a free ledger slot"
          - "<gray>(<white><used>/<max></white> <gray>used)."
          - "<gray>Removing it later costs <white><fine></white>."
          - ""
          - "<yellow>Click to select it."
      remove:
        name: "<red>Remove this ledger"
        lore:
          - "<gray>Frees its slot for a fine of <white><fine></white>."
          - "<gray>Deliveries on the way still arrive."
          - ""
          - "<yellow>Click to remove it."
      owner-only:
        name: "<gray>Select this ledger"
        lore:
          - "<gray>Only the owner can select"
          - "<gray>and remove ledgers."
      full:
        name: "<gray>No free ledger slot"
        lore:
          - "<gray>All <white><max></white> <gray>ledger slots are used."
          - "<gray>Remove a ledger first."
    confirm:
      select-title: "Select this ledger?"
      select:
        name: "<ledger>"
        lore:
          - "<gray>Uses one of your ledger slots."
          - "<gray>Removing it later costs <white><fine></white>."
      remove-title: "Remove this ledger?"
      remove:
        name: "<red>Remove <ledger>"
        lore:
          - "<gray>You pay a fine of <white><fine></white>."
          - "<gray>Deliveries on the way still arrive."
  imports:
    not-allowed: "<red>Only the owner of <business> and groups allowed to order imports can order here."
    no-free-slot: "<red>All <max> delivery slot(s) are in use. Collect a delivery first."
    cannot-afford: "<red>That import costs <white><price></white>, and you don't have that much."
    time-not-offered: "<red>That import can't be delivered with that delivery time."
    no-character: "<red>You need an active character to order imports."
    ordered: "<green>Ordered <import><green> for <white><price></white>. It arrives in <white><duration></white> (<time><green>)."
    ordered-pier: "<green>Ordered <import><green> for <white><price></white>. It arrives at <pier> <green>in <white><duration></white> (<time><green>)."
    choose-pier: "<red>Choose a receiving pier for this import first."
    pier-gone: "<red>The pier <yellow><pier></yellow> doesn't exist any more. Choose another one."
    pier-closed: "<red>The pier <yellow><pier></yellow> is closed. Choose another one."
    # When another plugin stops an order without giving its own reason.
    order-cancelled: "<red>This import can't be ordered right now."
    # When it gives one: <reason> is its text.
    order-cancelled-reason: "<red><reason>"
    button:
      name: "<gold>Imports"
      lore:
        - "<gray>Order goods from your ledgers."
        - ""
        - "<white><free>/<max></white> <gray>delivery slots free"
        - ""
        - "<yellow>Click to browse imports."
      lore-not-allowed:
        - "<gray>Only the owner and groups allowed"
        - "<gray>to order imports can use this."
    menu:
      title: "Imports · <business>"
      header:
        name: "<gold>Imports"
        lore:
          - "<white><free>/<max></white> <gray>delivery slots free"
          - "<gray>From <white><ledgers></white> <gray>selected ledger(s)."
          - "<gray>Choose a delivery time on the right."
      from: "<dark_gray>From <ledger>"
      not-offered: "<gray>Not available with <time><gray>."
      no-price: "<red>No price yet: an item has no base value."
      click: "<yellow>Click to order."
      no-free-slot: "<red>No free delivery slot."
    time:
      selected:
        name: "<green>▶ <time>"
        lore:
          - "<gray>Arrives <white><duration></white> after ordering."
          - "<green>Prices shown are for this time."
      other:
        name: "<time>"
        lore:
          - "<gray>Arrives <white><duration></white> after ordering."
          - "<yellow>Click to show prices for this time."
    contents:
      item: "<white><amount></white> <gray>×</gray> <white><item></white>"
      rolls: "<white><rolls></white> <gray>random roll(s) of:"
      option: "<gray>  • <white><amount></white> × <white><item></white> <dark_gray>(<chance>%)"
    price:
      base: "<gray>Price before modifiers: <white><price></white>"
      modifier: "<gray>  <name><gray>: <yellow><amount>"
      # Shown when the ledger is tax exempt and some modifiers were ignored.
      exempt: "<dark_gray>Tax exempt, not applied:"
      skipped: "<dark_gray>  <st><name>: <amount></st>"
      final: "<gold>Price: <white><price></white>"
    confirm:
      title: "Order this import?"
      time: "<gray>Delivery: <time> <gray>(<white><duration></white><gray>)"
      pier: "<gray>Receiving pier: <pier>"
      no-pier: "<red>No receiving pier chosen yet."
      final: "<red>Orders can't be cancelled, and the pier can't be changed."
    # The button under the import in the confirmation, and the list of piers it opens.
    pier:
      chosen:
        name: "<gold>Pier: <pier>"
        lore:
          - "<gray>Where this import is unloaded."
          - "<yellow>Click to choose another pier."
      none:
        name: "<red>Choose a receiving pier"
        lore:
          - "<gray>Every import is unloaded at a pier."
          - "<gray>You can't change it after ordering."
          - "<yellow>Click to choose."
      menu:
        title: "Receiving pier"
        header:
          name: "<gold>Receiving piers"
          lore:
            - "<gray>Choose where this import is unloaded."
            - "<gray>Closed piers aren't listed."
        selected: "<green>▶ Chosen"
        click: "<yellow>Click to choose this pier."
  slots:
    gone: "<red>That delivery was already collected."
    not-ready: "<red>That delivery arrives in <white><duration></white>."
    not-allowed: "<red>Only whoever ordered it, the owner of <business> and groups allowed to order imports can collect deliveries."
    item-missing: "<red>An item of that delivery has no item file any more, so it stays in its slot. Ask staff to restore it."
    collected: "<green>Collected <import><green>."
    collected-dropped: "<green>Collected <import><green>. Your inventory was full, so some items dropped at your feet."
    button:
      name: "<gold>Delivery slots"
      lore:
        - "<white><used>/<max></white> <gray>slots in use"
        - "<white><ready></white> <gray>delivery(ies) ready to collect"
        - ""
        - "<yellow>Click to see your deliveries."
      lore-not-allowed:
        - "<gray>Only the owner and groups allowed"
        - "<gray>to order imports can use this."
    menu:
      title: "Deliveries · <business>"
      header:
        name: "<gold>Delivery slots"
        lore:
          - "<white><used>/<max></white> <gray>slots in use"
          - "<gray>Deliveries keep arriving while you're offline."
      free:
        name: "<gray>Free delivery slot"
        lore:
          - "<gray>Order an import to fill it."
      item: "<white><amount></white> <gray>×</gray> <white><item></white>"
      ordered-by: "<gray>Ordered by <white><character></white>"
      pier: "<gray>Arriving at <pier>"
      arrives: "<yellow>Arrives in <white><duration></white>"
      ready: "<green>Ready! Click to collect."
  exports:
    not-allowed: "<red>Only the owner of <business> and groups allowed to sell exports can sell here."
    not-enough: "<red>Each sale is exactly <white><batch></white> item(s), and you have <white><have></white>."
    pay-failed: "<red>Couldn't pay you <white><price></white>. Make room for the coins and try again; nothing was taken."
    sold: "<green>Sold <white><batch></white> item(s) to <export><green> for <white><price></white>."
    # Another plugin stopped the sale (ExportSellEvent); nothing was paid or taken.
    sale-cancelled: "<red>This export can't be sold right now."
    # When it gives one: <reason> is its text.
    sale-cancelled-reason: "<red><reason>"
    button:
      name: "<gold>Exports"
      lore:
        - "<gray>Sell goods through your ledgers."
        - "<gray>The money goes to you."
        - ""
        - "<yellow>Click to browse exports."
      lore-not-allowed:
        - "<gray>Only the owner and groups allowed"
