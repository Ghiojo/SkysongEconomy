          - "<gray>Removing a ledger costs <white><fine></white>."
      selected: "<green>Selected by this business"
      not-selected: "<gray>Not selected"
      click: "<yellow>Click to see its imports and exports."
    details:
      title: "<ledger>"
      counts: "<white><imports></white> <gray>import(s), <white><exports></white> <gray>export(s)"
