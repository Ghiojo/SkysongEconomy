    invalid-amount: "<red><yellow><amount></yellow> isn't an amount. Write a percentage with %, like +10%, or a flat amount for Claims, like +50."
    invalid-flat: "<red><yellow><amount></yellow> isn't a valid flat amount. Use a number other than 0, up to <max>."
    flat-needs-claims: "<red><yellow><amount></yellow> is a flat amount, which only Claim prices take. For a percentage, write it with %, like <amount>%."
    claims-only-target: "<red><yellow><target></yellow> is a Claim target, so the modifier needs on:claims."
    not-a-claim-target: "<red>Claim modifiers go on global, claim-type:\\<type> or claim:\\<claim>, not <yellow><target></yellow>."
    claim-discount: "<red>Claim modifiers can only raise a price, so <yellow><amount></yellow> must be positive."
    unknown-claim-type: "<red>SkysongClaims has no Claim type <yellow><type></yellow>."
    unknown-pier: "<red>There is no pier <yellow><pier></yellow>."
    pier-imports-only: "<red>Only imports go to a pier, so a modifier on <yellow><target></yellow> must apply to imports."
    unknown-claim: "<red>SkysongClaims has no Claim <yellow><claim></yellow>."
    invalid-name: "<red>The display name can be at most <max> characters."
    invalid-duration: "<red><yellow><duration></yellow> isn't a valid time. Use something like 30m, 12h, 7d or 1d12h."
    invalid-applies-to: "<red><yellow><value></yellow> isn't valid after on:. Use imports, exports, both or claims."
    already-expired: "<red>That modifier would already be expired."

# SkysongClaims Claims (/se claim). <claim> is a Claim's id; <price> an amount of money as players read it.
claims:
  unknown-claim: "<red>There is no Claim <yellow><claim></yellow>."
  free: "<red><yellow><claim></yellow> is a Free Claim: Free Claims are never priced or sold."
  owned: "<red><yellow><claim></yellow> has owners, so the server can't sell it."
  sold-elsewhere: "<red><yellow><claim></yellow> is already for sale by <plugin>."
  no-price: '<red><yellow><claim></yellow> has no price. Give it one: /se claim sell <claim> \<price>'
  not-for-sale: "<red><yellow><claim></yellow> isn't for sale."
  price-not-positive: "<red>A Claim's price must be more than 0, and <yellow><expression></yellow> is worth <value>."
  price-set: "<green>The price of <white><claim></white> is now <white><price></white> <dark_gray>(<expression>)"
  price-cleared: "<green>Removed the price of <white><claim></white>."
  price-cleared-unlisted: "<green>Removed the price of <white><claim></white>. It was for sale, so it is off sale now."
  price-none: "<gray><claim> has no price."
  price-view: "<gold><claim></gold><gray>: <white><price></white> <dark_gray>(<expression>, set by <by>)"
  price-share: "<gray>  + <name> <dark_gray>(<amount> on <target>)</dark_gray>: <white><share>"
  price-total: "<gray>  A buyer pays <white><price></white> in total."
  price-view-broken: "<gold><claim></gold><gray>: <red>can't be worked out</red> <dark_gray>(<expression>, set by <by>)"
  listed: "<green><white><claim></white> is for sale for <white><price></white>."
  unlisted: "<green><white><claim></white> is no longer for sale. Its price stays saved."
  list-header: "<gold>Claims for sale (<count>):"
  # <price> is what a buyer pays now, modifiers included; <asking> is what the seller asks.
  list-entry: "<gray>- <white><claim></white> <dark_gray>(<type>)</dark_gray>: <white><price></white> <dark_gray>(asking <asking>)"
  list-entry-broken: "<gray>- <white><claim></white> <dark_gray>(<type>)</dark_gray>: <red>price can't be worked out"
  list-empty: "<gray>No Claims are for sale."
  modifiers-off: "<red>Businesses are disabled, so there are no price modifiers."
  # Line 4 of a Claim sign while SkysongEconomy has it on sale: what a buyer pays. Signs fit about 15 characters.
  sign-price: "<gold><price>"
  # The same, when modifiers raise the price above the asking price.
  sign-price-raised: "<gold><price> <red>↑"
  # Buying (/se claim buy, and the Buy button in a Claim sign's menu).
  buy:
    not-for-sale: "<red><yellow><claim></yellow> isn't for sale."
    not-here: "<red>You aren't standing in a Claim. Name one: /se claim buy \\<claim>"
    no-character: "<red>Choose a character first: Claims are owned by characters."
    menus-off: "<red>Buying Claims is off while businesses are disabled, since it uses their menus."
    type-limit: "<red>Your character already owns as many Claims of this type as allowed."
    # Another plugin stopped the purchase without saying why (ClaimPurchaseAttemptEvent).
    cancelled: "<red>You can't buy <yellow><claim></yellow> right now."
    full: "<red><yellow><claim></yellow> has no room for another owner."
    already-owner: "<red>Your character already owns <yellow><claim></yellow>."
    own-claim: "<red>One of your characters owns <yellow><claim></yellow>, so you can't buy it."
    unknown-character: "<red>SkysongClaims doesn't know your character."
    failed: "<red><yellow><claim></yellow> couldn't be given to you, so your money was given back."
    price-changed: "<red>The price of <yellow><claim></yellow> changed to <white><price></white>. Have a look again before you buy."
    no-money: "<red><yellow><claim></yellow> costs <white><price></white>, and you have <white><balance></white>."
    bought: "<green>You bought <white><name></white> for <white><price></white>. It belongs to <white><character></white> now."
    button-name: "<green>Buy this Claim"
    button-lore: "<gray>For <white><price></white>"
    confirm:
      title: "Buy <name>?"
      # The lines under the Claim's name in the confirmation.
      type: "<gray>Type: <white><type>"
      seller-server: "<gray>Sold by: <white>the server"
      seller-owners: "<gray>Sold by: <white><owners>"
      asking: "<gray>Price: <white><price>"
      share: "<gray>+ <name>: <white><share>"
      total: "<gold>You pay: <white><price>"
      balance: "<gray>You have: <white><balance>"
      owner: "<gray>It will belong to: <white><character>"
  # Owners selling their own Claim (/se claim sell and unsell, and the Sell button in a Claim sign's menu).
  sell:
    not-owner: "<red>Your character doesn't own <yellow><claim></yellow>."
    price-needed: "<red>Say what you ask for it: /se claim sell <claim> \\<price>"
    prompt: "<gold>What do you ask for this Claim? <gray>Type an amount in chat, or <white>cancel</white>."
    listed: "<green><white><claim></white> is for sale for <white><price></white>. You and its other owners share that when it sells; modifiers may make the buyer pay more. Any owner can take it off sale with /se claim unsell <claim>."
    unlisted: "<green><white><claim></white> is no longer for sale."
    co-owner-listed: "<gold><lister></gold> <gray>put <white><claim></white> on sale for <white><price></white>. You share that when it sells. Don't want to sell? /se claim unsell <claim>"
    sold: "<green><white><claim></white> was sold to <white><buyer></white>. You received <white><price></white>."
    sold-later: "<green><white><claim></white> was sold to <white><buyer></white>. <yellow>Your <price> couldn't be paid now; make room for the coins and rejoin to get it."
    button-name: "<gold>Sell this Claim"
    button-lore: "<gray>Set a price and put it on sale"
    unsell-button-name: "<red>Take it off sale"
    unsell-button-lore: "<gray>On sale for <white><price></white>"
    confirm:
      title: "Sell <name>?"
      price: "<gray>You ask: <white><price>"
      split: "<gray>Shared equally between its <white><count></white> owners"
      modifiers: "<gray>Modifiers may make the buyer pay more; that part isn't yours."
  # A seller's share of a sale that couldn't be paid at once.
  payout:
    paid: "<green>You received <white><price></white> from the sale of <white><claim></white>."
    waiting: "<yellow>You still have <white><price></white> from the sale of <white><claim></white> waiting: make room for the coins and rejoin."

# NPC upkeep (npc-upkeep.yml). Lines about one NPC can use <npc> (its name), <profile>, <state>
# (the maintained or unmaintained word below) and <next> (time left until its next cycle).
upkeep:
  maintained: "<green>Maintained"
  unmaintained: "<#e08080>Unmaintained"
  look-at-npc: "<red>Look at an NPC within a few blocks first."
  not-managed: "<red>That isn't an NPC SkysongNPCs manages."
  none: "<gray><npc> has no upkeep."
  none-by-hand: "<gray><npc> has no upkeep: staff took it away. <white>/se upkeep set template</white> lets its template decide again."
  unknown-profile: "<red>There is no upkeep profile <yellow><profile></yellow>. Profiles: <profiles>"
  unknown-state: "<red>Use maintained or unmaintained."
  info-header: "<gold>Upkeep of <white><npc></white>: <state>"
  info-profile: "<gray>Profile: <white><profile></white><gray> (<source>), one cycle every <white><every></white>"
  info-cost: "<gray>Cost per cycle: <white><cost></white>"
  info-next: "<gray>Next cycle in <white><next></white>. The stock covers <white><cycles></white> more cycle(s)."
  info-unmaintained: "<gray>Unmaintained for <white><since></white>: it eats nothing until it is maintained again."
  source-template: "from its template"
  source-hand: "set by staff"
  profile-missing: "<red><profile> is no longer in npc-upkeep.yml, so its cycles wait."
  set: "<green><npc> now follows the upkeep profile <white><profile></white>. Its next cycle is in <white><next></white>."
  set-none: "<green><npc> no longer has an upkeep, whatever its template says. Anything stocked in it was dropped at its feet."
  set-template: "<green><npc>'s template decides its upkeep again: <state>"
  set-template-none: "<green><npc>'s template decides its upkeep again: it has none."
  marked: "<green><npc> is now <state><green>. Its next cycle is in <white><next></white>."
  marked-unmaintained: "<green><npc> is now <state><green>. It eats nothing until it is maintained again."
  list-header: "<gold>NPCs with an upkeep (<count>):"
  list-empty: "<gray>No NPC has an upkeep."
  list-entry: "<gray>- <white><npc></white> <dark_gray>(<profile>)</dark_gray>: <state><gray>, next cycle <white><next></white>"
  list-entry-unmaintained: "<gray>- <white><npc></white> <dark_gray>(<profile>)</dark_gray>: <state><gray> since <white><since></white> ago"
  # The Upkeep button in an NPC's menu, and the chest it opens.
  button:
    name: "<gold>Upkeep"
    state: "<state>"
    cost: "<gray>Each cycle eats: <white><cost>"
    next: "<gray>Next cycle in <white><next></white>; the stock covers <white><cycles></white> cycle(s)."
    unmaintained: "<gray>Unmaintained for <white><since></white>: it eats nothing until it is repaired."
    hint: "<yellow>Click to open its upkeep chest."
  chest-title: "<dark_gray>Upkeep: <npc>"
  # The line under an unmaintained NPC's name.
  name-line: "<#e08080>Unmaintained"
  # The line under an unmaintained NPC's sheet (/snpc sheet), after its abilities.
  sheet-line: "<#e08080>Unmaintained"
  # The trait an unmaintained NPC's item carries (SkysongItems prints the lore line). Use the
  # trait id "unmaintained" in the SkysongCrafting recipe that repairs it. Changes apply after
  # a restart or /si reload.
  trait:
    lore: "<#e08080>[Unmaintained]"
    name: "Unmaintained"
    description: "This NPC's upkeep ran out. Repairing the item makes it maintained again."
  chest-refused-item: "<red>That item doesn't pay this NPC's upkeep."
  chest-deposit-only: "<red>You can put upkeep items in, but only those who may edit the NPC's inventory can take them out."
  cost-entry-item: "<amount>x <item>"
  cost-entry-good-type: "<amount>x any <type>"

# Receiving piers (/se pier and the API's refusals).
piers:
  invalid-id: "<red><yellow><id></yellow> can't be a <what>: use 1 to 64 letters, digits, _ and -."
  invalid-owner: "<red><yellow><owner></yellow> can't own a pier."
  exists: "<red>There already is a pier <yellow><pier></yellow>."
  unknown: "<red>There is no pier <yellow><pier></yellow>."
  from-config: "<red><yellow><pier></yellow> comes from piers.yml: change its name, icon and description, or remove it, in the file."
  invalid-chance: "<red>A loss chance must be a number from 0 to 100, not <yellow><chance></yellow>."
  invalid-amount: "<red><yellow><amount></yellow> isn't an amount. Use points like +5 or -5, or a percentage like +10%."
  modifier-from-config: "<red>The loss modifier <yellow><modifier></yellow> of <pier> comes from piers.yml: remove it there, or replace it with /se pier modifier set."
  list-empty: "<gray>There are no piers."
  list-header: "<gold>Piers (<count>):"
  list-entry: "<gray>- <white><pier></white> <name><gray>: loses <white><chance></white> of shipments <dark_gray>(<source>)"
  list-entry-closed: "<gray>- <white><pier></white> <name> <red>(closed)<gray>: loses <white><chance></white> of shipments <dark_gray>(<source>)"
  info-open: "<gold><pier></gold> <name> <green>(open)</green> <dark_gray>from <source>"
  info-closed: "<gold><pier></gold> <name> <red>(closed)</red> <dark_gray>from <source>"
  info-chance: "<gray>Loss chance: <white><chance></white> for untagged cargo <dark_gray>(base <base>)"
  info-modifier: "<gray>- <white><modifier></white>: <amount>"
  info-modifier-tag: "<gray>- <white><modifier></white>: <amount> <dark_gray>(only <tag>)"
  info-data: "<dark_gray>- <key>: <value>"
  opened: "<green><name> <green>is open: new imports can pick it."
  closed: "<green><name> <green>is closed: new imports can't pick it. Shipments already on their way still arrive."
  chance-set: "<green>The base loss chance of <name> <green>is now <white><base></white>; untagged cargo is lost <white><chance></white> of the time."
  modifier-set: "<green>Set <white><modifier></white> <amount> on <name><green>; untagged cargo is now lost <white><chance></white> of the time."
  modifier-set-tag: "<green>Set <white><modifier></white> <amount> on <name> <green>for <white><tag></white> cargo."
  modifier-removed: "<green>Removed the loss modifier <white><modifier></white> from <name><green>."
  modifier-none: "<gray><name> <gray>has no loss modifier <modifier> set by a command or plugin."
  reloaded: "<green>Reloaded piers.yml: <white><count></white> pier(s)."
  # Collecting a delivery that was lost at its pier (by its loss chance, or seized by another
  # plugin). <import> and <pier> are its names (<pier> is empty for imports without a pier).
  seized: "<red>Your cargo was seized! <gray>(<import><gray>)"
  # When the plugin that seized it gave a reason: <reason> is its text.
  seized-reason: "<red>Your cargo was seized! <gray><reason>"
  reload-warnings: "<yellow><count> problem(s) in piers.yml, see the console."
history:
  # /se history: <filter> is what was asked for, such as "business tavern" or "all".
  header: "<gold>Economy history <gray>(<filter>, page <page>, newest first):"
  empty: "<gray>No records for <white><filter></white> on page <page>."
  # One record. <ic> is the IC date (empty without SkysongCalendar), <who> the character who did it ("-" for
  # nobody), <business> the business's name, <items> and <money> what moved ("-" for nothing).
  entry: "<dark_gray><time> <ic></dark_gray> <white><kind></white> <gray><who> <business><dark_gray>:</dark_gray> <items> <dark_gray>|</dark_gray> <money>"
  unknown-kind: "<red>There is no record kind <yellow><kind></yellow>. <gray>Kinds: <kinds>"
  invalid-page: "<red>A page is a number from 1 to <max>, not <yellow><page></yellow>."
  failed: "<red>The economy history could not be read; see the console."
