        name: "<gray>Select this ledger"
        lore:
          - "<gray>Only the owner can select"
          - "<gray>and remove ledgers."
      full:
        name: "<gray>No free ledger slot"
        lore:
          - "<gray>All <white><max></white> <gray>ledger slots are used."
          - "<gray>Remove a ledger first."
    confirm:
      select-title: "Select this ledger?"
      select:
        name: "<ledger>"
        lore:
          - "<gray>Uses one of your ledger slots."
          - "<gray>Removing it later costs <white><fine></white>."
      remove-title: "Remove this ledger?"
      remove:
        name: "<red>Remove <ledger>"
        lore:
          - "<gray>You pay a fine of <white><fine></white>."
          - "<gray>Deliveries on the way still arrive."
