# Every player-facing text of SkysongEconomy, in MiniMessage (https://docs.advntr.dev/minimessage/format.html).
# Words in <angle_brackets> that aren't colours are placeholders filled in by the plugin.
# Keys you delete fall back to the defaults, so it's safe to keep only the ones you change.

prefix: "<dark_gray>[<gold>SkysongEconomy<dark_gray>] <reset>"

command:
  players-only: "<red>Only players can use this command."
  no-permission: "<red>You don't have permission to do that."
  usage: "<red>Usage: <usage>"
  look-at-block: "<red>Look at a block within 5 blocks first."
  unknown-player: "<red>No player named <yellow><player></yellow> has played here."
  no-active-character: "<red><player> isn't playing a character right now. Name one of their profiles."
  unknown-character: "<red><player> has no character called <yellow><profile></yellow>."
  you-have-no-character: "<red>You need to be playing a character to do that."

menu:
  previous-page: "<yellow>Previous page"
  next-page: "<yellow>Next page"
  back: "<yellow>Back"
  close: "<red>Close"
  confirm: "<green><bold>Confirm"
  cancel: "<red><bold>Cancel"

prompt:
  cancel-word: "cancel"
  cancelled: "<gray>Cancelled."
  timed-out: "<gray>You took too long to answer, so nothing changed."
  rename: "<yellow>Type the business's new name in chat, or <white>cancel</white> to keep the current one."

business:
  not-found: "<red>There is no business with the id <yellow><id></yellow>."
  invalid-id: "<red><yellow><id></yellow> isn't a valid id. Use lower case letters, digits, '_' and '-'."
  id-taken: "<red>A business with the id <yellow><id></yellow> already exists."
  unknown-type: "<red>There is no business type called <yellow><type></yellow>."
  block-taken: "<red>That block already belongs to <yellow><business></yellow>."
  invalid-name: "<red>A business name must be 1 to <max> characters."
  invalid-shift-message: "<red>A shift message must be 1 to <max> characters."
  invalid-tier: "<red>The tier must be a number from <min> to <max>."
  not-owner: "<red>Only the owner of <yellow><business></yellow> can do that."
  hire:
    is-owner: "<red>The owner doesn't need to be hired."
    already-worker: "<red><character> already works here."
    full: "<red>This business is full: its tier allows <max> worker(s)."
  fire:
    not-worker: "<red><character> doesn't work here."
  created: "<green>Created the <type> business <yellow><business></yellow> for <owner>."
  deleted: "<green>Deleted the business <yellow><business></yellow>."
  delete-confirm: "<yellow>This deletes <business> for good. Run <white>/se business delete <id> confirm</white> to go ahead."
  moved: "<green><yellow><business></yellow> now opens from this block."
  renamed: "<green>The business is now called <yellow><business></yellow>."
  shift-message-set: "<green>Shift message set to: <gray><message>"
  shift-message-reset: "<green>The shift message is back to the server default."
  tier-set: "<green><yellow><business></yellow> is now tier <tier>."
  tier-removed-workers: "<yellow>The new tier has fewer worker slots, so these newest hires were removed: <workers>"
  tier-removed-picks: "<yellow>The new tier has fewer skill picks, so these newest picks were removed: <skills>"
  owner-set: "<green><yellow><business></yellow> now belongs to <owner>."
  hired: "<green><character> now works at <yellow><business></yellow>."
  fired: "<green><character> no longer works at <yellow><business></yellow>."
  info: |-
    <gold><business> <gray>(<id>)
    <gray>Type: <white><type></white>  Tier: <white><tier></white>
    <gray>Owner: <white><owner></white>
    <gray>Workers (<count>/<max>): <white><workers></white>
    <gray>Skill picks (<free_picks> free): <white><picks></white>
    <gray>Block: <white><position></white>
  info-no-workers: "none"
  info-no-block: "none, use /se business move"
  list-header: "<gold>Businesses (<count>):"
  list-entry: "<gray>- <white><business></white> <dark_gray>(<id>, <type>, tier <tier>)"
  access:
    no-such-group: "<red>This business has no group called <yellow><group></yellow>."
    invalid-group-id: "<red>A group name may use lower case letters, digits, '_' and '-', up to <max> characters."
    group-taken: "<red>This business already has a group called <yellow><group></yellow>."
    too-many-groups: "<red>A business can have at most <max> groups of its own."
    built-in-delete: "<red>The <yellow><group></yellow> group is built in and can't be deleted."
    built-in-members: "<red>Who is in <yellow><group></yellow> is decided for you: workers are its workers, everyone is everyone."
    already-member: "<red><character> is already in <yellow><group></yellow>."
    not-member: "<red><character> isn't in <yellow><group></yellow>."
    unknown-permission: "<red><yellow><permission></yellow> isn't a permission. Use one of: <permissions>."
    invalid-price: "<red><yellow><price></yellow> isn't a valid price. Use a number of 0 or more."
    group-created: "<green>Created the group <yellow><group></yellow> at <business>. It allows nothing yet: use <white>allow</white> to change that."
    group-deleted: "<green>Deleted the group <yellow><group></yellow> from <business>."
    allowed: "<green>Members of <yellow><group></yellow> may now <permission> at <business>."
    denied: "<green>Members of <yellow><group></yellow> may no longer <permission> at <business>."
    price-set: "<green>Training at <business> now costs members of <yellow><group></yellow> <white><price></white>."
    member-added: "<green><character> is now in <yellow><group></yellow> at <business>."
    member-removed: "<green><character> is no longer in <yellow><group></yellow> at <business>."
    list-header: "<gold>Access groups of <business>:"
    list-entry: "<gray>- <white><group></white>: <permissions>. Training costs <white><price></white>. <dark_gray>Members: <members>"
    members-workers: "its workers"
    members-everyone: "everyone"
    members-none: "nobody yet"
    permissions-none: "may do nothing"
  vault:
    empty: "<red>The vault is empty."
    collect-failed: "<red>Couldn't pay out <amount>. Make room for the coins and try again; the vault keeps them."
    balance: "<gold>The vault of <business> holds <white><amount></white>."
    collected: "<green>Paid <white><amount></white> from the vault of <business> to <owner>."
    collected-own: "<green>You collected <white><amount></white> from the vault."
    button:
      name: "<gold>Vault"
      lore:
        - "<gray>Holds <white><amount></white>: your cut of"
        - "<gray>shift pay and paid training."
        - ""
        - "<yellow>Click to collect it."
      lore-empty:
        - "<gray>Empty. It fills with your cut"
        - "<gray>of shift pay and paid training."
  activity:
    busy-shift: "<red>You're already working a shift (at <business>). One shift or training at a time."
    busy-training: "<red>You're already training (at <business>). One shift or training at a time."
  shift:
    not-worker: "<red>Only the owner and workers of <business> can work shifts there."
    no-downtime: "<red>A shift costs <cost> downtime and your preferred pool doesn't have that much. See /downtime preference."
    cancelled: "<red>Your shift couldn't start right now."
    nothing-owed: "<red><business> owes you nothing yet."
    pay-failed: "<red>Couldn't pay you <amount>. Make room for the coins and try again; nothing was lost."
    started: "<green>You started a shift at <yellow><business></yellow>. It ends after <minutes> minute(s) online and not AFK."
    finished: "<green>Your shift at <yellow><business></yellow> is done. Open the business and use Retrieve Pay."
    retrieved: "<green>You were paid <pay>."
    pay-money: "<white><money></white>"
    pay-with-tokens: "<white><money></white> and <white><tokens></white> Gathering Token(s)"
    button:
      name: "<green>Work a Shift"
      name-unavailable: "<gray>Work a Shift"
      lore:
        - "<gray>Takes <white><minutes> minute(s)</white> online, not AFK."
        - "<gray>Costs <white><cost> downtime</white>."
        - "<gray>Pays <pay><gray>."
        - ""
        - "<yellow>Click to start."
      lore-working:
        - "<gray>You're working a shift here."
        - "<gray>About <white><minutes> minute(s)</white> left."
      lore-busy:
        - "<gray>You're already busy with a"
        - "<gray>shift or training somewhere."
      lore-not-worker:
        - "<gray>Only the owner and workers"
        - "<gray>can work shifts here."
      lore-no-character:
        - "<gray>Play a character to work shifts."
    retrieve:
      name: "<gold>Retrieve Pay"
      lore:
        - "<gray>You're owed <pay><gray>."
        - ""
        - "<yellow>Click to collect it."
      lore-nothing:
        - "<gray>Nothing to collect here."
        - "<gray>Finished shifts are paid here."
  picks:
    not-offered: "<red>A business of this type can't pick <yellow><skill></yellow>."
    none-free: "<red>Every skill pick is used. A tier <tier> business has <tier> pick(s)."
    no-such-pick: "<red>There is no pick number <yellow><number></yellow>. This business has <count> pick(s)."
    not-owner: "<red>Only the owner can choose the business's skills."
    picked: "<green><business> now dedicates a pick to <skill>."
    cleared: "<green>Cleared pick <number> (<skill>) of <yellow><business></yellow>. The owner can choose again."
    button:
      name: "<aqua>Skill picks"
      lore:
        - "<gray>The skills this business works with."
        - "<gray>Picks used: <white><used>/<tier></white>"
        - ""
        - "<yellow>Click to view"
    menu:
      title: "<dark_gray>Skill picks: <business>"
      picked:
        name: "<white>Pick <number>: <skill>"
        lore:
          - "<gray>This pick is permanent."
      empty-owner:
        name: "<green>Pick <number>: free"
        lore:
          - "<gray>Choose a skill of this business's type."
          - ""
          - "<yellow>Click to choose"
      empty:
        name: "<gray>Pick <number>: free"
        lore:
          - "<gray>The owner hasn't chosen yet."
      locked:
        name: "<dark_gray>Pick <number>: locked"
        lore:
          - "<gray>Unlocks at tier <number>."
    choice:
      title: "<dark_gray>Choose a skill"
      skill:
        name: "<skill>"
        lore:
          - "<gray>Already picked: <white><count></white> time(s)"
          - ""
          - "<yellow>Click to pick"
    confirm:
      title: "<dark_gray>Pick this skill?"
      summary:
        name: "<skill>"
        lore:
          - "<gray>This uses pick <number> of <tier>."
          - "<red>Picks are permanent: only staff can clear one."
  nameplate: "<gold><business>"
  menu:
    title: "<dark_gray><business>"
    header:
      name: "<gold><business>"
      lore:
        - "<gray>Type: <type>"
        - "<gray>Tier: <white><tier></white>"
        - "<gray>Owner: <white><owner></white>"
        - "<gray>Workers: <white><workers>/<max></white>"
      lore-manager:
        - "<gray>Type: <type>"
        - "<gray>Tier: <white><tier></white>"
        - "<gray>Owner: <white><owner></white>"
        - "<gray>Workers: <white><workers>/<max></white>"
        - ""
        - "<yellow>Click to rename"

  block:
    protected: "<red>This block belongs to <yellow><business></yellow> and can't be broken."
    unplaced: "<yellow>You broke the block of <business>. It is kept without a block: use /se business move <id> to place it again."

tokens:
  balance-own: "<gold>You have <white><tokens></white> Gathering Token(s)."
  balance: "<gold><character> has <white><tokens></white> Gathering Token(s)."
  changed: "<green><character> now has <white><tokens></white> Gathering Token(s)."
  invalid-amount: "<red><yellow><amount></yellow> isn't a valid amount of tokens. Use a whole number above 0 (0 is fine for set)."
  not-enough: "<red><character> only has <balance> token(s), so <amount> can't be removed."
