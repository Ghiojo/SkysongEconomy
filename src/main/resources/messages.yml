      export-tag: "<light_purple>Export"
      import-times: "<gray>Delivery: <times>"
      export-item: "<gray>Sells <white><batch></white> × <white><item></white> per click"
      export-good-type: "<gray>Sells <white><batch></white> item(s) of type <white><type></white> per click"
