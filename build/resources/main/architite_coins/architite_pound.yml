lore:
- |-
  <gray>A nicely-sized coin with an almost
  <gray>transparent resin which seems to contain a
  <gray>very packed concentration of gold dust
  <gray>inside, which makes it hard to see through
  <gray>it. This leaves the coin with a sparkly
  <gray>golden color. Etched onto the coin is a fleur
  <gray>de lis, and the coin is ridged in order to
  <gray>make it hard for people to shave it. Unlike
  <gray>what the name suggests, this coin does not
  <gray>weigh a pound, nor has a pound of Architite,
  <gray>but instead its name is but a slang term for
  <gray>this kind of denomination.
- '&#424242This is worth <gold>10.0 AU<dark_gray>.'
